[project]
name = "cadre-chatbot"
version = "0.1.0"
description = "Cadence: support chatbot for Cadre AI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117.1",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "uvicorn>=0.30"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
